name: Build OpenWrt KN-1510 with USB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libncurses5-dev gawk python3 python3-distutils unzip rsync wget xz-utils zstd file 2>&1 | tail -3

      - name: Clone OpenWrt
        run: git clone --depth=1 https://github.com/openwrt/openwrt.git

      - name: Apply DTS
        run: cp target/linux/ramips/dts/mt7628an_keenetic_kn-1510.dts openwrt/target/linux/ramips/dts/mt7628an_keenetic_kn-1510.dts

      - name: Copy config files
        run: cp -r files openwrt/

      - name: Configure
        run: |
          cd openwrt
          echo "CONFIG_TARGET_ramips=y" > .config
          echo "CONFIG_TARGET_ramips_mt76x8=y" >> .config
          echo "CONFIG_TARGET_ramips_mt76x8_DEVICE_keenetic_kn-1510=y" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-base-ru=y" >> .config
          echo "CONFIG_PACKAGE_dropbear=y" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-core=y" >> .config
          echo "CONFIG_PACKAGE_kmod-usb2=y" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-ohci=y" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-ehci=y" >> .config
          echo "CONFIG_PACKAGE_block-mount=y" >> .config
          echo "CONFIG_PACKAGE_kmod-fs-ext4=y" >> .config
          make defconfig 2>&1 | tail -5

      - name: Build
        run: |
          cd openwrt
          make -j$(nproc 2>/dev/null || echo 2) 2>&1 | tail -20

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-kn1510-usb
          path: openwrt/bin/targets/ramips/mt76x8/openwrt-*-squashfs-sysupgrade.bin